<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC</title>
    <style>
        video {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <h1>Sender</h1>
    <video id="myCamera" playsinline autoplay muted></video>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9/simplepeer.min.js"></script>
    <script type="module">

        const $myCamera = document.getElementById('myCamera');

        let socket;
        let myStream;
        let peer;

        let targetSocketId;

        const init = async () => {
            targetSocketId = getUrlParameter('id');
            if (!targetSocketId) {
                alert(`Missing target ID in querystring`);
                return;
            }
            const constraints = { audio: false, video: { width: 1280, height: 720 } };
            myStream = await navigator.mediaDevices.getUserMedia(constraints);
            $myCamera.srcObject = myStream;
            initSocket();
        };

        const callPeer = (peerId) => {
            // Sender is de initiator
            peer = new SimplePeer({
                initiator: true,
                stream: myStream,
                trickle: true,
                config: {
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                }
            });

            peer.on('signal', (signalData) => {
                console.log('Sending signal to', peerId);
                socket.emit('signal', peerId, signalData);
            });

            peer.on('connect', () => {
                console.log('Peer connected!');
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
            });
        };

        const getUrlParameter = name => {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? false : decodeURIComponent(results[1].replace(/\+/g, ' '));
        };

        const initSocket = () => {
            socket = io.connect(`/`);
            socket.on('connect', () => {
                console.log(socket.id);
                callPeer(targetSocketId);
            });

            // Ontvang signalen van de receiver
            socket.on('signal', (fromId, signalData) => {
                console.log(`Received signal from ${fromId}`);
                if (peer) {
                    peer.signal(signalData);
                }
            });
        };

        init();

    </script>
</body>

</html>
