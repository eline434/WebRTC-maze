<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC</title>
    <style>
        video {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: 100%;
            margin: 0;
        }

        .menubar {
            z-index: 1;
        }

        p {
            margin: 0;
            margin-left: 10px;
            color: #40531a;
            font-weight: 800;
        }

        #mazeCanvas {
            position: absolute;
            margin-top: 100px;
            margin-left: -370px;
            background-color: #7FA347;
            border: 5px solid #4E6227;
            border-radius: 10px;
        }

        @media screen and (max-width: 568px) {
            body {
                flex-direction: column;
            }

            #mazeCanvas {
                width: 70%;
                margin-left: -165px;

            }

            #arrowMessage {
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
            }
        }
    </style>
    <h1>Receiver</h1>
    <div id="qr"></div>

    <div class="menubar">
        </h2>
        <button class="startbtn">Start</button>
        <button id="btnUp">Up</button>
        <button id="btnDown">Down</button>
        <button id="btnLeft">Left</button>
        <button id="btnRight">Right</button>
    </div>
    <div class="content">
        <div class="msgbox"></div>
        <canvas id="mazeCanvas" height="400px" width="400px">
        </canvas>
    </div>
    <video id="otherCamera" playsinline autoplay muted></video>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9/simplepeer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script type="module">

        const $otherCamera = document.getElementById('otherCamera');

        let socket;
        let peer;

        const init = async () => {
            initSocket();
        };

        const initSocket = () => {
            socket = io.connect(`/`);
            socket.on(`connect`, () => {
                console.log(socket.id);
                const url = `${new URL(`/sender.html?id=${socket.id}`, window.location)}`;
                console.log(url);

                const typeNumber = 4;
                const errorCorrectionLevel = 'L';
                const qr = qrcode(typeNumber, errorCorrectionLevel);
                qr.addData(url);
                qr.make();
                document.getElementById('qr').innerHTML = qr.createImgTag(4);
            });

            // Ontvang signalen van de sender
            socket.on('signal', (fromId, signalData) => {
                console.log(`Received signal from ${fromId}`);

                // Als er nog geen peer is, maak er één aan (niet-initiator)
                if (!peer) {
                    peer = new SimplePeer({
                        initiator: false,
                        trickle: true,
                        config: {
                            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                        }
                    });

                    peer.on('signal', (data) => {
                        console.log('Sending signal back to', fromId);
                        socket.emit('signal', fromId, data);
                    });

                    peer.on('stream', (stream) => {
                        console.log('Received stream');
                        $otherCamera.srcObject = stream;
                    });

                    peer.on('connect', () => {
                        console.log('Peer connected!');
                    });

                    peer.on('error', (err) => {
                        console.error('Peer error:', err);
                    });
                }

                // Feed het signaal aan simple-peer
                peer.signal(signalData);
            });
        };

        const canvas =
            document.getElementById('mazeCanvas');
        const pen =
            canvas.getContext('2d');

        const width = canvas.width;
        const height = canvas.height;
        let cellSize = 40;

        const playerRadius = cellSize / 2 - 5;
        const endRadius = cellSize / 2 - 5;

        let trail = [];
        let generatedMaze;
        let solutionPath;

        let points = 0;
        const cols =
            Math.floor(width / cellSize);
        const rows =
            Math.floor(height / cellSize);
        const player1 = {
            x: 0,
            y: 0,
            color: 'red',
        };

        const end = {
            x: cols - 1,
            y: rows - 1,
            color: 'blue',
        };

        const $startButton = document.querySelector('.startbtn');

        $startButton.addEventListener('click', function () {
            resetPlayerPos();
            clearScreen();
            setup();
            draw();
            addListener();
            displayHidden();
        });

        document.addEventListener('DOMContentLoaded',
            function () {

            });

        function addListener() {
            document.addEventListener('keydown', handleKeyPress);
        }

        document.getElementById('btnUp').
            addEventListener('click', function () {
                movePlayer('ArrowUp', player1);
                draw();
            });

        document.getElementById('btnDown').
            addEventListener('click', function () {
                movePlayer('ArrowDown', player1);
                draw();
            });

        document.getElementById('btnLeft').
            addEventListener('click', function () {
                movePlayer('ArrowLeft', player1);
                draw();
            });

        document.getElementById('btnRight').
            addEventListener('click', function () {
                movePlayer('ArrowRight', player1);
                draw();
            });

        function handleKeyPress(event) {
            const key = event.key;
            movePlayer(key, player1);
            draw();
        }

        function showRestartMessage() {
            const messageBox =
                document.getElementsByClassName('msgbox')[0];
            messageBox.innerHTML = "Invalid Move. Press restart.";
            messageBox.innerHTML +=
                `<br>
    <button class='restartbtn' 
            style='margin-top:70px;' 
            onclick='resetState()'>
            Restart
    </button>`;
            messageBox.style.visibility = "visible";
            messageBox.style.fontSize = "1.7em"
            messageBox.style.color = "white"
            messageBox.style.fontFamily =
                `'Lucida Sans', 
    'Lucida Sans Regular', 
    'Lucida Grande', 
    'Lucida Sans Unicode', 
    Geneva, Verdana, sans-serif`

        }
        function resetState() {
            const messageBox =
                document.getElementsByClassName('msgbox')[0];
            messageBox.style.visibility = "hidden";
        }
        function movePlayer(key, player) {
            let validMove = false;

            switch (key) {
                case 'ArrowUp':
                    if (player.y > 0 &&
                        cells[player.x][player.y].
                            walls.top === false) {
                        player.y--;
                        points++;
                        validMove = true;
                    }
                    break;
                case 'ArrowDown':
                    if (player.y < rows - 1 &&
                        cells[player.x][player.y].
                            walls.bottom === false) {
                        player.y++;
                        points++;
                        validMove = true;
                    }
                    break;
                case 'ArrowLeft':
                    if (player.x > 0 &&
                        cells[player.x][player.y].
                            walls.left === false) {
                        player.x--;
                        points++;
                        validMove = true;
                    }
                    break;
                case 'ArrowRight':
                    if (player.x < cols - 1 &&
                        cells[player.x][player.y].
                            walls.right === false) {
                        player.x++;
                        points++;
                        validMove = true;
                    }
                    break;
            }
            if (!validMove) {
                return;
            }

            const isTwice = trail.some(
                cell => cell.x === player.x &&
                    cell.y === player.y);
            if (isTwice) {
                showRestartMessage();
                resetPlayerPos();
            }

            if (player.x == cols - 1 && player.y == rows - 1) {
                document.
                    removeEventListener('keydown', handleKeyPress);
                const messageBox =
                    document.getElementsByClassName('msgbox')[0];

                messageBox.innerHTML = "<h1>You Won!</h1>"
                messageBox.innerHTML += "<h2 id='moves'>Moves</h2>"
                messageBox.innerHTML +=
                    `<button id='done' onclick='location.reload()'>
            Play Again
        </button>`
                document.getElementById('moves').innerHTML = "Moves:" + points;
                messageBox.style.fontSize = "1em"
                messageBox.style.color = "black"
                messageBox.style.fontFamily =
                    `'Lucida Sans', 
        'Lucida Sans Regular', 
        'Lucida Grande', 
        'Lucida Sans Unicode', 
        Geneva, Verdana, sans-serif`
                messageBox.style.visibility = "visible";
            }
        }

        function clearScreen() {
            pen.canvas.width = pen.canvas.width;
        }

        function displayHidden() {
            document.getElementsByClassName('msgbox')[0].
                style.visibility = "hidden";
        }

        const cells = [];

        for (let x = 0; x < rows; x++) {
            cells[x] = [];
            for (let y = 0; y < cols; y++) {
                cells[x][y] = null;
            }
        }

        class CellA {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.visited = false;
                this.walls = {
                    top: true,
                    right: true,
                    bottom: true,
                    left: true,
                };
            }

            show() {
                const x = this.x * cellSize;
                const y = this.y * cellSize;

                pen.beginPath();

                if (this.walls.top) {
                    pen.moveTo(x, y);
                    pen.lineTo(x + cellSize, y);
                }

                if (this.walls.right) {
                    pen.moveTo(x + cellSize, y);
                    pen.lineTo(x + cellSize, y + cellSize);
                }

                if (this.walls.bottom) {
                    pen.moveTo(x + cellSize, y + cellSize);
                    pen.lineTo(x, y + cellSize);
                }

                if (this.walls.left) {
                    pen.moveTo(x, y + cellSize);
                    pen.lineTo(x, y);
                }
                pen.strokeStyle = 'green';
                pen.lineWidth = 5;
                pen.lineCap = "round";
                pen.stroke();
            }
        }

        function setup() {
            // Initialize the cells
            for (let x = 0; x < rows; x++) {
                for (let y = 0; y < cols; y++) {
                    cells[x][y] = new CellA(x, y);
                }
            }
            genMaze(0, 0);
        }

        function genMaze(x, y) {
            const presentCell = cells[x][y];
            presentCell.visited = true;

            const directions =
                randomize(['top', 'right', 'bottom', 'left']);

            for (const direction of directions) {
                const dx =
                    { top: 0, right: 1, bottom: 0, left: -1 }[direction];
                const dy =
                    { top: -1, right: 0, bottom: 1, left: 0 }[direction];

                const newX = x + dx;
                const newY = y + dy;
                // if the coordinates are inbound
                if (newX >= 0 && newX < cols
                    && newY >= 0 && newY < rows) {
                    const neighbour = cells[newX][newY];

                    // removing walls

                    if (!neighbour.visited) {
                        presentCell.walls[direction] = false;
                        neighbour.walls[{
                            top: 'bottom',
                            right: 'left',
                            bottom: 'top',
                            left: 'right',
                        }[direction]] = false;
                        genMaze(newX, newY);
                    }
                }
            }
            generatedMaze =
                cells.map(row => row.map(
                    cell => ({ ...cell })));
            solutionPath = solveMaze();
        }


        function resetPlayerPos() {
            player1.x = 0;
            player1.y = 0;
            points = 0;
            trail = [];
        }

        function draw() {
            clearScreen();
            genMaze(player1.x, player1.y);

            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    cells[x][y].show();
                }
            }

            trail.push({ x: player1.x, y: player1.y });
            pen.beginPath();
            for (let i = 0; i < trail.length; i++) {
                const trailX =
                    trail[i].x * cellSize + cellSize / 2;
                const trailY =
                    trail[i].y * cellSize + cellSize / 2;

                if (i === 0) {
                    pen.moveTo(trailX, trailY);
                } else {
                    pen.lineTo(trailX, trailY);
                }
            }
            pen.lineCap = "round";
            pen.strokeStyle = "white";
            pen.lineWidth = 4;
            pen.stroke();

            drawPlayer(player1);
            drawEnd();


            pen.strokeStyle = 'green';
            pen.lineWidth = 6;
            pen.lineCap = "round";
            pen.stroke();

            const isPartOfSolution =
                solutionPath.some(cell =>
                    cell.x === player1.x &&
                    cell.y === player1.y);

            if (!isPartOfSolution) {
                showRestartMessage();
                player1.x = 0;
                player1.y = 0;
                points = 0;
                trail = [];
                draw();
            }
        }

        function drawPlayer(player) {
            const x = player.x * cellSize + cellSize / 2;
            const y = player.y * cellSize + cellSize / 2;

            pen.beginPath();
            pen.arc(x, y, playerRadius, 0, 2 * Math.PI);
            pen.fillStyle = player.color;
            pen.fill();
        }

        function drawEnd() {
            const x = (end.x + 0.5) * cellSize;
            const y = (end.y + 0.5) * cellSize;

            pen.beginPath();
            pen.arc(x, y, endRadius, 0, 2 * Math.PI);
            pen.fillStyle = end.color;
            pen.fill();

        }

        function randomize(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function solveMaze() {
            const visited =
                Array.from({ length: rows },
                    () => Array(cols).fill(false));
            const path = [];

            function dfs(x, y) {
                if (x < 0 || x >= cols || y < 0 ||
                    y >= rows || visited[y][x]) {
                    return false;
                }

                visited[y][x] = true;
                path.push({ x, y });

                if (x === cols - 1 && y === rows - 1) {
                    return true;
                }

                const cell = generatedMaze[x][y];

                if (!cell.walls.top && dfs(x, y - 1)) {
                    return true;
                }
                if (!cell.walls.right && dfs(x + 1, y)) {
                    return true;
                }
                if (!cell.walls.bottom && dfs(x, y + 1)) {
                    return true;
                }
                if (!cell.walls.left && dfs(x - 1, y)) {
                    return true;
                }

                path.pop();
                return false;
            }

            dfs(0, 0);
            return path;
        }

        setup();
        draw();

        init();

    </script>
</body>

</html>
