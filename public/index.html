<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Receiver</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div id="page">
        <!-- Level-complete flash -->
        <div id="levelComplete">
            <div class="lc-text"></div>
        </div>

        <!-- Round-complete overlay -->
        <div id="Message-Container">
            <div id="message">
                <h1>Round Complete!</h1>
                <div id="roundBody"></div>
                <input id="okBtn" type="button" onclick="restartFromOverlay()" value="Play Again" />
            </div>
        </div>

        <!-- Menu -->
        <div id="menu">
            <div class="custom-select">
                <select id="diffSelect">
                    <option value="10">Easy</option>
                    <option value="15">Medium</option>
                    <option value="25">Hard</option>
                    <option value="38">Extreme</option>
                </select>
            </div>
            <input id="startMazeBtn" type="button" onclick="makeMaze()" value="New Maze" />
            <span id="levelIndicator"></span>
        </div>

        <!-- Status -->
        <p id="status">Connecting…</p>

        <!-- QR code -->
        <div id="qr"></div>

        <!-- Maze -->
        <div id="mazeContainer">
            <canvas id="mazeCanvas" height="600" width="600"></canvas>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9/simplepeer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <!-- App scripts -->
    <!-- <script type="module" src="/js/maze.js"></script> -->
    <script type="module" src="/js/connection.js"></script>
</body>

</html>
