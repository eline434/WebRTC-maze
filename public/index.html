<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Receiver</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div id="page">
        <div id="modeSelection">
            <h1>Maze Game</h1>
            <p>Choose your mode</p>
            <div class="mode-actions">
                <button id="modeSoloBtn" class="primary-btn">Play Solo</button>
                <button id="modeDuoBtn" class="primary-btn alt-btn">Play With Two</button>
            </div>
        </div>

        <!-- Level-complete flash -->
        <div id="levelComplete">
            <div class="lc-text"></div>
        </div>

        <!-- Round-complete overlay -->
        <div id="Message-Container">
            <div id="message">
                <h1>Round Complete!</h1>
                <div id="roundBody"></div>
            </div>
        </div>

        <!-- Status -->
        <p id="status">Connecting…</p>
        <p id="raceInfo"></p>

        <!-- QR code -->
        <div id="qr"></div>

        <!-- Maze -->
        <div id="mazeContainer">
            <canvas id="mazeCanvas" height="600" width="600"></canvas>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9/simplepeer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <!-- <script type="module" src="/js/maze.js"></script> -->
    <script type="module" src="/js/connection.js"></script>
</body>

</html>
